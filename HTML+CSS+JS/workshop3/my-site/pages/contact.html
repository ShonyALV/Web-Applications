<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body>
    <!-- Theme toggle: fijo en la esquina inferior izquierda, presente en las 6 páginas -->
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch to light mode">🌙</button>

    <header>
        <h1>Contact Form</h1>
        <nav>
            <a href="../index.html">Home</a>
            <a href="courses.html">Courses</a>
            <a href="schedule.html">Schedule</a>
            <a href="research.html">Research</a>
            <a href="clubs.html">Leadership Experience</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <main>
        <h2 class="section-title">Get in Touch</h2>

        <!-- id="contact-form": usado por script.js para validar antes de enviar -->
        <form class="contact-form" id="contact-form" novalidate>
            <!-- Name -->
            <div>
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name">
                <span class="error-message"></span>
            </div>

            <!-- Email -->
            <div>
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email">
                <span class="error-message"></span>
            </div>

            <!-- Date of Birth -->
            <div>
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" min="1920-01-01" max="2026-09-07">
            </div>

            <!-- Degree Program -->
            <div>
                <label for="program">Degree Program:</label>
                <input type="text" id="program" name="program" placeholder="Enter your degree program">
            </div>

            <!-- Semester -->
            <div>
                <label for="semester">Semester:</label>
                <input type="number" id="semester" name="semester" min="1" max="12" placeholder="Enter your semester">
                <span class="error-message"></span>
            </div>

            <!-- Reason for Contact -->
            <div>
                <label for="reason">Reason for Contact:</label>
                <select id="reason" name="reason">
                    <option value="">--Select a reason--</option>
                    <option value="academic">Academic Inquiry</option>
                    <option value="technical">Technical Support</option>
                    <option value="personal">Personal Request</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <!-- Message -->
            <div>
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" placeholder="Write your message here"></textarea>
                <span class="error-message"></span>
            </div>

            <!-- Acceptance Checkbox -->
            <div class="checkbox-row">
                <input type="checkbox" id="accept" name="accept">
                <label for="accept">I accept the terms and conditions</label>
            </div>

            <!-- Submit Button -->
            <input type="submit" value="Submit" class="btn">
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Jhony – Contact Page</p>
    </footer>

    <!-- LINKED: jQuery (última versión) + lógica propia del sitio -->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="../script.js"></script>

</body>
</html>
